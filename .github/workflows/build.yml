name: Build HDF5

env:
  HDF5_VERSION: 2.2.0
  HDF5_SHA256: 1a1ab8209b35586fbc1aa279ba76d102130b95badcb20ca329587219112d8c16
  HDF5_SOVERSION: 320

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            image: manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            image: manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          DIST: ${{ github.workspace }}/dist
        run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: hdf5-${{ env.HDF5_VERSION }}-${{ matrix.image }}
          path: |
            dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hdf5-${{ env.HDF5_VERSION }}-*
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.HDF5_VERSION }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "HDF5 $TAG built on manylinux_2_28 for x86_64 and aarch64"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *.tar.gz
